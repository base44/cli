name: wix gateway proxy check

# Dummy connectivity check for the Wix npm embargo gateway: runs the
# wix-gateway-proxy action, then curls the registry so the request resolves
# through the gateway and prints the result.
on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: wix-gateway-proxy-check-${{ github.ref }}
  cancel-in-progress: true

jobs:
  proxy-check:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Wix gateway proxy (mandatory)
        uses: ./.github/actions/wix-gateway-proxy

      - name: Connection check through the gateway
        # -v prints the negotiated chain, which is the actual signal here: the
        # subject/issuer must be the embargo proxy, not npm's real Cloudflare cert.
        shell: bash
        run: curl -vI https://registry.npmjs.org/react

      - name: NPM install for verification
        shell: bash
        run: npm install mermaid-rs-wasm@0.0.3

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: latest

      - name: Bun install for verification
        shell: bash
        run: |
          mkdir -p "$RUNNER_TEMP/bun-check" && cd "$RUNNER_TEMP/bun-check"
          npm init -y >/dev/null
          bun add mermaid-rs-wasm@0.0.3
