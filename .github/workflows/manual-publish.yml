name: Manual Package Publish

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version to publish (e.g., 1.0.0, patch, minor, major)"
        required: true
        default: "patch"
        type: string
      npm_tag:
        description: "NPM tag to publish with (e.g., latest, beta, alpha)"
        required: true
        default: "latest"
        type: string
      dry_run:
        description: "Run in dry-run mode (no actual publish)"
        required: false
        default: false
        type: boolean
      notify_skills_repo:
        description: "Notify the skills repo about the release"
        required: false
        default: true
        type: boolean

env:
  CLI_PACKAGE_DIR: packages/cli

# Split into two jobs on purpose, and the split is the security control:
#
#   build   — fully gatewayed. Every dependency install happens here, behind the
#             Wix embargo gateway, so the cooldown applies to the whole tree.
#             This job never unpins the registry and holds no publish credential.
#   publish — installs nothing. It only downloads the artifact build produced and
#             runs `npm publish`. Because no dependency is ever resolved in this
#             job, unpinning the registry cannot pull an un-embargoed package.
#
# Previously both happened in one job, so "nothing is installed after the unpin"
# was true only by step ordering — a comment, not a guarantee. Now it holds by
# construction: the publish job has no package manager install step at all.
jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      new_version: ${{ steps.version.outputs.new_version }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Wix gateway proxy (mandatory)
        uses: ./.github/actions/wix-gateway-proxy

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: ".node-version"

      # No `npm install -g npm@latest`. Trusted publishing needs npm >= 11.5.1 and
      # every Node 24.x release bundles npm >= 11.6.2, so `.node-version` already
      # clears the floor. Upgrading would also fetch npm through the gateway, which
      # refuses a release until it clears the cooldown — a self-inflicted flake.

      - name: Setup Bun
        id: setup-bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Cache Bun dependencies
        uses: actions/cache@v5
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-${{ steps.setup-bun.outputs.bun-version }}-${{ hashFiles('**/bun.lock') }}
          restore-keys: |
            ${{ runner.os }}-bun-${{ steps.setup-bun.outputs.bun-version }}-

      # The only dependency install in this workflow, and it runs gatewayed.
      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Set version
        id: version
        working-directory: ${{ env.CLI_PACKAGE_DIR }}
        run: |
          VERSION_INPUT="${{ github.event.inputs.version }}"
          if [[ "$VERSION_INPUT" =~ ^(patch|minor|major)$ ]]; then
            bunx json-bump package.json --$VERSION_INPUT
          else
            bunx json-bump package.json --replace="$VERSION_INPUT"
          fi
          NEW_VERSION=$(node -p "require('./package.json').version")
          echo "NEW_VERSION=$NEW_VERSION" >> $GITHUB_ENV
          echo "new_version=$NEW_VERSION" >> $GITHUB_OUTPUT

      - name: Build package
        run: bun run build
        working-directory: ${{ env.CLI_PACKAGE_DIR }}

      - name: Build standalone binaries
        run: bun run build:binaries
        working-directory: ${{ env.CLI_PACKAGE_DIR }}

      - name: Package binaries for release
        run: bun run package:binaries
        working-directory: ${{ env.CLI_PACKAGE_DIR }}

      - name: Upload sourcemaps to PostHog
        if: github.event.inputs.dry_run == 'false'
        uses: PostHog/upload-source-maps@v0.4.6
        with:
          directory: ./${{ env.CLI_PACKAGE_DIR }}/dist/cli
          env-id: ${{ vars.POSTHOG_PROJECT_ID }}
          cli-token: ${{ secrets.POSTHOG_CLI_API_KEY }}
          version: ${{ env.NEW_VERSION }}

      - name: Show package info
        working-directory: ${{ env.CLI_PACKAGE_DIR }}
        run: |
          echo "Package name: $(node -p "require('./package.json').name")"
          echo "Version: ${{ env.NEW_VERSION }}"
          echo "NPM tag: ${{ github.event.inputs.npm_tag }}"
          echo "Dry run: ${{ github.event.inputs.dry_run }}"

      # Carries the version-bumped package.json, dist/, and dist/binaries/ over to
      # the publish job so it never has to install or build anything itself.
      # devDependencies are still present here; publish strips them with jq.
      - name: Upload package for publish
        uses: actions/upload-artifact@v4
        with:
          name: cli-package
          path: |
            ${{ env.CLI_PACKAGE_DIR }}
            !${{ env.CLI_PACKAGE_DIR }}/node_modules
          include-hidden-files: true
          retention-days: 1

  publish:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      # contents: write for the release commit, tag, and GitHub Release.
      # id-token: write for npm trusted publishing (OIDC).
      contents: write
      id-token: write
    env:
      NEW_VERSION: ${{ needs.build.outputs.new_version }}

    steps:
      - name: Checkout for wix gateway proxy
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          sparse-checkout: .github

      - name: Wix gateway proxy (mandatory)
        uses: ./.github/actions/wix-gateway-proxy

      - name: Generate a token
        id: generate-token
        uses: actions/create-github-app-token@v2
        with:
          app-id: ${{ vars.BASE44_GITHUB_ACTIONS_APP_ID }}
          private-key: ${{ secrets.BASE44_GITHUB_ACTIONS_APP_PRIVATE_KEY }}
          owner: base44

      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ steps.generate-token.outputs.token }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: ".node-version"
          registry-url: "https://registry.npmjs.org"

      # Overwrites the checkout's packages/cli with the built, version-bumped copy.
      # This is the whole reason the job needs no install and no build.
      - name: Download built package
        uses: actions/download-artifact@v4
        with:
          name: cli-package
          path: ${{ env.CLI_PACKAGE_DIR }}

      - name: Unpin npm registry for first-party publish
        # TEMPORARY — remove once the embargo gateway handles publish itself.
        # The gateway is *meant* to pass publish upstream, but `npm publish` sends
        # `PUT /<package>`, which matches neither the `^~ /-/` passthrough block nor
        # `~ \.tgz$`, so it lands in `location /` (proxy_metadata — a read path, with
        # caching). The gateway also sets no client_max_body_size, so nginx's 1 MB
        # default rejects a packument carrying the base64 tarball. Tracked by
        # secplatform.
        #
        # Unpinning is safe here specifically because this job installs nothing:
        # no dependency is resolved while the gateway is bypassed, and no npm
        # credential exists in the job to be stolen.
        run: sudo sed -i '/registry\.npmjs\.org/d' /etc/hosts

      - name: Publish to NPM
        # Authenticates via npm trusted publishing (OIDC) using `id-token: write`
        # above — deliberately no NODE_AUTH_TOKEN/NPM_TOKEN, so no npm credential
        # reaches the build. Requires a trusted publisher for `base44` registered on
        # npmjs.com against this repo AND this workflow filename (the registry keys
        # on the filename, so each publish workflow needs its own entry). Provenance
        # is then generated automatically.
        working-directory: ${{ env.CLI_PACKAGE_DIR }}
        run: |
          # Remove devDependencies before publish (everything is bundled)
          cp package.json package.json.bak
          jq 'del(.devDependencies)' package.json > package.json.tmp && mv package.json.tmp package.json
          npm publish --tag ${{ github.event.inputs.npm_tag }} ${{ github.event.inputs.dry_run == 'true' && '--dry-run' || '' }}
          mv package.json.bak package.json

      - name: Create Git tag
        if: github.event.inputs.dry_run == 'false'
        env:
          GH_TOKEN: ${{ steps.generate-token.outputs.token }}
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git remote set-url origin "https://x-access-token:${GH_TOKEN}@github.com/${{ github.repository }}.git"
          git add ${{ env.CLI_PACKAGE_DIR }}/package.json
          git commit -m "chore: release v${{ env.NEW_VERSION }}"
          git tag v${{ env.NEW_VERSION }}
          git push origin HEAD:${{ github.ref }}
          git push origin v${{ env.NEW_VERSION }}

      - name: Create GitHub Release and upload binaries
        if: github.event.inputs.dry_run == 'false'
        env:
          GH_TOKEN: ${{ steps.generate-token.outputs.token }}
        run: |
          RELEASE_URL=$(gh release create "v${{ env.NEW_VERSION }}" \
            --title "Release v${{ env.NEW_VERSION }}" \
            --notes "## Installation

          **npm:**
          \`\`\`bash
          npm install -g base44@${{ github.event.inputs.npm_tag }}
          \`\`\`

          **Homebrew:**
          \`\`\`bash
          brew install base44/tap/base44
          \`\`\`

          **Version:** ${{ env.NEW_VERSION }}
          **NPM Tag:** ${{ github.event.inputs.npm_tag }}" \
            ${{ env.CLI_PACKAGE_DIR }}/dist/binaries/base44-*.tar.gz)
          echo "RELEASE_URL=$RELEASE_URL" >> $GITHUB_ENV

      - name: Update Homebrew Tap
        if: github.event.inputs.dry_run == 'false' && github.event.inputs.npm_tag == 'latest'
        env:
          GH_TOKEN: ${{ steps.generate-token.outputs.token }}
        run: bash ${{ env.CLI_PACKAGE_DIR }}/infra/homebrew/update-tap.sh "${{ env.NEW_VERSION }}" "${{ env.CLI_PACKAGE_DIR }}/dist/binaries"

      - name: Notify skills repo
        if: github.event.inputs.dry_run == 'false' && github.event.inputs.notify_skills_repo == 'true'
        uses: peter-evans/repository-dispatch@v4
        with:
          token: ${{ steps.generate-token.outputs.token }}
          repository: base44/skills
          event-type: cli-release
          client-payload: |
            {
              "version": "v${{ env.NEW_VERSION }}",
              "release_url": "${{ env.RELEASE_URL }}",
              "release_name": "Release v${{ env.NEW_VERSION }}"
            }
