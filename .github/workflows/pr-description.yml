name: Auto PR Description

on:
  pull_request:
    types: [opened, synchronize]

jobs:
  generate-description:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
      issues: read
      id-token: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Run Claude to Generate PR Description
        id: claude-description
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          direct_prompt: |
            Analyze this pull request and update its description with a summary.

            IMPORTANT INSTRUCTIONS:
            1. First, read the current PR description using: gh pr view ${{ github.event.pull_request.number }} --json body
            2. Analyze all the changes in this PR to understand what it does at a high level
            3. Write a concise summary (2-4 sentences max) that explains WHAT this PR accomplishes and WHY, not a list of every file changed
            4. Update the PR description by APPENDING your summary below any existing content

            The appended section MUST be formatted exactly like this:

            ---

            <details>
            <summary>🤖 AI-Generated Summary</summary>

            [Your 2-4 sentence summary here]

            <sub>Generated by Claude on [current UTC timestamp in format: YYYY-MM-DD HH:MM UTC]</sub>
            </details>

            Use the gh CLI to update the PR:
            gh pr edit ${{ github.event.pull_request.number }} --body "[existing body + new section]"

            If the PR description already contains an "AI-Generated Summary" section, replace that section with the updated summary instead of appending a new one.
          allowed_tools: |
            Bash(gh pr view *)
            Bash(gh pr edit *)
            Bash(git diff *)
            Bash(git log *)
            Read
            Glob
            Grep
