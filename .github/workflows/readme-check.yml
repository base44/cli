name: README Check

on:
  push:
    branches: [main]
    paths:
      - "src/cli/commands/**"
      - "README.md"
  workflow_dispatch:

jobs:
  readme-check:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install Claude Code
        run: npm install -g @anthropic-ai/claude-code@latest

      - name: Run Claude README Check
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          claude -p "$(cat <<'EOF'
          You are checking whether README.md is still accurate after changes on main.

          GROUND TRUTH (read from the repo):
          1. Read src/cli/program.ts to get all registered commands. Note which are registered with { hidden: true } — those should NOT appear in the README command table.
          2. For each command, read the corresponding factory file under src/cli/commands/ to get:
             - Command name and subcommand names (e.g. "dashboard open", "site deploy")
             - The .description() string for each command/subcommand
          3. Read package.json for: the "name" field (install command) and "engines"."node" if present (Node.js requirement).

          COMPARE AGAINST README.md:
          - Command table: Every non-hidden command/subcommand must be listed. Use the descriptions from the codebase as the basis for the description in the table. They don't need to match exactly. They should be concise and user-friendly. If a description already exists, only change it if it's factually incorrect. Remove any row for a command that no longer exists.
          - Installation section: Package name and Node version mentioned must match package.json.
          - Quick start: The example commands (e.g. base44 login, base44 create) must still exist as commands in the codebase.

          RULES:
          1. If everything matches, do nothing further and exit.
          2. If you find discrepancies: Update README.md with the correct content, then commit and push the fix: git config user.name "github-actions[bot]"; git config user.email "github-actions[bot]@users.noreply.github.com"; git add README.md; git commit -m "docs: sync README with CLI commands"; git push.
          3. Only modify README.md. Do not touch any other file.
          EOF
          )" --allowedTools "Read,Glob,Grep,Write(README.md),Edit(README.md),Bash(git config *),Bash(git add README.md),Bash(git commit *),Bash(git push *)"

      - name: Restore lychee cache
        uses: actions/cache@v4
        with:
          path: .lycheecache
          key: cache-lychee-${{ github.sha }}
          restore-keys: cache-lychee-

      - name: Check for broken links in README
        id: lychee
        uses: lycheeverse/lychee-action@v2
        with:
          args: --verbose --no-progress --cache --max-cache-age 1d --format json --output .lychee-results.json README.md
          fail: false
          jobSummary: true

      - name: Fix broken links in README
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          claude -p "$(cat <<'EOF'
          You manage broken links in README.md. Read .lychee-results.json for lychee's link check results.

          TWO JOBS:

          1. REMOVE broken links:
             For each link that lychee reports as broken/errored (status is not 200/2xx), find it in README.md
             and convert the markdown link to plain text with a tracking comment:
               [Display Text](https://broken-url) → <!-- broken-link: [Display Text](https://broken-url) -->Display Text

          2. RESTORE previously-removed links:
             Search README.md for <!-- broken-link: [text](url) --> comments.
             If the URL in such a comment is NOT in lychee's broken list (meaning it works now),
             restore the link and remove the comment:
               <!-- broken-link: [Display Text](https://fixed-url) -->Display Text → [Display Text](https://fixed-url)

          RULES:
          1. If there are no broken links AND no broken-link comments to restore, do nothing and exit.
          2. If you make changes: commit and push using: git config user.name "github-actions[bot]"; git config user.email "github-actions[bot]@users.noreply.github.com"; git add README.md; git commit -m "docs: fix broken links in README"; git push.
          3. Only modify README.md.
          4. Preserve all surrounding content exactly as-is.
          EOF
          )" --allowedTools "Read,Grep,Edit(README.md),Bash(git config *),Bash(git add README.md),Bash(git commit *),Bash(git push *)"
